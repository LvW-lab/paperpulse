name: PaperPulse Newsletter

on:
  workflow_dispatch: {}
  schedule:
    # Daily (Mon–Fri) at 06:30 UTC ≈ 07:30 Amsterdam (winter)
    - cron: "30 6 * * 1-5"
    # Weekly (Sunday) at 17:00 UTC ≈ 18:00 Amsterdam (winter)
    - cron: "0 17 * * 0"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download previous DB artifact (if exists)
        uses: actions/download-artifact@v4
        with:
          name: paperpulse-db
          path: .
        continue-on-error: true

      - name: Run pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then
            python scripts/run_daily.py
          elif [ "${{ github.event.schedule }}" = "0 17 * * 0" ]; then
            python scripts/run_weekly.py
          else
            python scripts/run_daily.py
          fi

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperpulse-db
          path: paperpulse.db
          retention-days: 30
