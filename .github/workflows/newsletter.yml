name: PaperPulse Newsletter

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: "Which report to run?"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - monthly
          - yearly
      days:
        description: "Override time window (days). Leave empty to use default."
        required: false
        type: string
  schedule:
    - cron: "30 6 * * 1-5"   # daily weekdays
    - cron: "0 17 * * 0"     # weekly Sunday
    - cron: "0 17 1 * *"     # monthly 1st day of month
    - cron: "0 18 1 1 *"     # yearly Jan 1st

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: paperpulse-db
          path: .
        continue-on-error: true

      - name: Run pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          REPORT_TYPE: ${{ github.event.inputs.report_type }}
          DAYS_OVERRIDE: ${{ github.event.inputs.days }}
        run: |
          set -e

          # Determine report type for scheduled runs
          if [ -z "$REPORT_TYPE" ]; then
            if [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then REPORT_TYPE="daily"; fi
            if [ "${{ github.event.schedule }}" = "0 17 * * 0" ]; then REPORT_TYPE="weekly"; fi
            if [ "${{ github.event.schedule }}" = "0 17 1 * *" ]; then REPORT_TYPE="monthly"; fi
            if [ "${{ github.event.schedule }}" = "0 18 1 1 *" ]; then REPORT_TYPE="yearly"; fi
          fi

          # Fallback (safety)
          if [ -z "$REPORT_TYPE" ]; then REPORT_TYPE="daily"; fi

          echo "REPORT_TYPE=$REPORT_TYPE"
          if [ "$REPORT_TYPE" = "daily" ]; then python scripts/run_daily.py; fi
          if [ "$REPORT_TYPE" = "weekly" ]; then python scripts/run_weekly.py; fi
          if [ "$REPORT_TYPE" = "monthly" ]; then python scripts/run_monthly.py; fi
          if [ "$REPORT_TYPE" = "yearly" ]; then python scripts/run_yearly.py; fi

      - name: Ensure DB exists
        run: |
          test -f paperpulse.db || touch paperpulse.db

      - uses: actions/upload-artifact@v4
        with:
          name: paperpulse-db
          path: paperpulse.db
          retention-days: 30
